name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm v12 successor of pnpm/action-setup: installs pnpm (from
      # packageManager) + Node.js (from devEngines.runtime) in one step,
      # then runs `pnpm install` automatically. No actions/setup-node needed.
      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - run: pnpm validate

      - run: pnpm build
