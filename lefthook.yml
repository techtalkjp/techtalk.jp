pre-commit:
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yml,yaml,html}'
      run: pnpm exec oxfmt -c .oxfmtrc.json {staged_files} && git add {staged_files}
    lint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: pnpm exec oxlint -c .oxlintrc.json --fix {staged_files} && git add {staged_files}
